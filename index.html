<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caderno de Flores — Hello Kitty Island Adventure</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Karla:wght@400;500;700;800&display=swap');

  :root {
    --paper: #FFF0F5;
    --paper-card: #FFFFFF;
    --ink: #4A2E35;
    --ink-soft: #8A6B73;
    --line: #FFD6E0;
    --line-strong: #FFB3C1;
    --stamp: #FF4D6D;
    --bg-overlay: rgba(74, 46, 53, 0.45);
    --accent: #FF758F;
    --accent-gold: #FFD166;
  }
  
  * { box-sizing: border-box; }
  
  html, body {
    background: linear-gradient(135deg, #FFE4E1 0%, #FFF0F5 40%, #F3E5F5 70%, #E8F5E9 100%) !important;
    background-attachment: fixed !important;
    color: var(--ink) !important;
    margin: 0; 
    padding: 24px 16px; 
    display: flex; 
    justify-content: center;
    font-family: 'Karla', sans-serif;
  }
  
  .hkia-wrap {
    background: var(--paper);
    border-radius: 28px;
    overflow: hidden;
    width: 100%;
    max-width: 960px;
    box-shadow: 0 16px 40px rgba(255, 117, 143, 0.25);
    position: relative;
    border: 4px solid #FFFFFF;
  }

  .hkia-cover {
    background: linear-gradient(135deg, #FF85A1 0%, #FF758F 40%, #FFA69E 100%);
    color: #FFFFFF;
    padding: 34px 32px 30px;
  }
  .hkia-cover h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: 28px;
    margin: 0 0 6px;
  }
  .hkia-cover p { margin: 0; font-size: 14.5px; opacity: 0.95; }
  
  .hkia-progress-row { display: flex; align-items: center; gap: 16px; margin-top: 22px; }
  .hkia-progress-track {
    flex: 1; height: 16px; background: rgba(255, 255, 255, 0.4);
    border-radius: 999px; overflow: hidden; padding: 3px;
  }
  .hkia-progress-fill {
    height: 100%; background: linear-gradient(90deg, #FFF1C5 0%, #FFD166 100%);
    border-radius: 999px; width: 0%; transition: width 0.4s ease;
  }
  .hkia-progress-label {
    font-family: 'Fredoka', sans-serif; font-size: 14px; font-weight: 600;
    background: rgba(255, 255, 255, 0.3); padding: 4px 12px; border-radius: 999px;
  }

  .hkia-tabs { display: flex; gap: 6px; padding: 18px 30px 0; background: var(--paper); }
  .hkia-tab {
    font-family: 'Fredoka', sans-serif; font-size: 15px; padding: 12px 22px;
    border-radius: 16px 16px 0 0; background: #FFE5EC; border: none;
    color: var(--ink-soft); cursor: pointer; transition: 0.2s;
  }
  .hkia-tab.active { background: var(--paper-card); color: var(--accent); font-weight: 700; }

  .hkia-body { padding: 26px 30px 34px; background: var(--paper-card); min-height: 500px; }
  .hkia-filters { display: flex; gap: 10px; margin-bottom: 26px; align-items: center; flex-wrap: wrap; }
  .hkia-filter-btn {
    font-family: 'Fredoka', sans-serif; font-size: 13px; padding: 8px 18px;
    border-radius: 999px; border: 2px solid var(--line); background: #FFF9FA;
    color: var(--ink-soft); cursor: pointer;
  }
  .hkia-filter-btn.active { background: var(--accent); color: #FFF; border-color: var(--accent); }
  .hkia-reset { margin-left: auto; font-family: 'Fredoka', sans-serif; font-size: 13px; color: var(--stamp); background: none; border: none; cursor: pointer; }

  .hkia-group { margin-bottom: 32px; }
  .hkia-group-header { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; border-bottom: 2px dashed var(--line-strong); padding-bottom: 8px; }
  .hkia-group-dot { width: 14px; height: 14px; border-radius: 50%; }
  .hkia-group-title { font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 19px; }

  .hkia-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; }
  .hkia-card {
    background: #FFF9FA; border: 2px solid var(--line); border-radius: 20px;
    padding: 18px 14px; text-align: center; cursor: pointer; transition: 0.2s;
    display: flex; flex-direction: column; align-items: center; position: relative;
  }
  .hkia-card:hover { border-color: var(--accent); transform: translateY(-3px); }
  .hkia-flower-img {
    width: 64px; height: 64px; margin-bottom: 10px; border-radius: 50%;
    background: #FFF; border: 2px solid #FFF0F3; display: flex; align-items: center; justify-content: center;
    overflow: hidden; padding: 4px;
  }
  .hkia-flower-img img { width: 100%; height: 100%; object-fit: contain; }
  .hkia-card-name { font-family: 'Fredoka', sans-serif; font-size: 16px; margin-bottom: 6px; }
  .hkia-card-meta { font-size: 12px; color: var(--ink-soft); background: #FFF; padding: 6px 12px; border-radius: 12px; border: 1px solid var(--line); width: 100%; }

  /* MODAL */
  .hkia-modal-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: var(--bg-overlay); display: none; justify-content: center; align-items: center;
    z-index: 999; padding: 20px; backdrop-filter: blur(4px);
  }
  .hkia-modal-overlay.open { display: flex; }
  .hkia-modal {
    background: #FFF; width: 100%; max-width: 760px; height: 85vh;
    border-radius: 24px; display: flex; flex-direction: column; overflow: hidden;
  }
  .hkia-modal-header {
    background: #FFE5EC; padding: 16px 24px; border-bottom: 2px solid var(--line);
    display: flex; justify-content: space-between; align-items: center;
  }
  .hkia-modal-header h2 { margin: 0; font-family: 'Fredoka', sans-serif; font-size: 22px; display: flex; align-items: center; gap: 10px; }
  .hkia-modal-close { background: #FFF; border: 2px solid var(--line-strong); width: 34px; height: 34px; border-radius: 50%; cursor: pointer; font-size: 18px; }
  .hkia-modal-body { padding: 20px 24px; overflow-y: auto; flex: 1; }

  /* SELETOR DE COR E COMBINAÇÃO */
  .color-picker-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
  .color-pill {
    display: flex; align-items: center; gap: 6px; padding: 6px 12px;
    border-radius: 999px; border: 2px solid var(--line); background: #FFF;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: 0.2s;
  }
  .color-pill.active { border-color: var(--accent); background: #FFF0F3; box-shadow: 0 2px 6px rgba(255,117,143,0.25); }
  .color-pill-dot { width: 12px; height: 12px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); }

  .combo-box {
    background: #FFF9FA; border: 2px solid var(--line-strong); border-radius: 18px; padding: 18px; margin-top: 10px;
  }
  .combo-title { font-family: 'Fredoka', sans-serif; font-size: 16px; margin-bottom: 12px; color: var(--accent); }
  .combo-options { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .combo-item {
    display: flex; align-items: center; gap: 10px; background: #FFF;
    padding: 10px 14px; border-radius: 12px; border: 1.5px solid var(--line);
    cursor: pointer; user-select: none; transition: 0.2s; font-size: 13.5px; font-weight: 600;
  }
  .combo-item:hover { border-color: var(--accent); }
  .combo-item.got { background: #EBFBEE; border-color: #81C784; color: #2E7D32; }
  .combo-checkbox { width: 18px; height: 18px; border-radius: 4px; border: 2px solid var(--line-strong); display: flex; align-items: center; justify-content: center; background: #FFF; }
  .combo-item.got .combo-checkbox { background: #4CAF50; border-color: #4CAF50; color: #FFF; }
</style>
</head>
<body>
<div class="hkia-wrap">
  <div class="hkia-cover">
    <h1>🌸 Caderno de Flores — HKIA</h1>
    <p>Selecione uma flor, escolha a cor e marque as combinações exatas obtidas.</p>
    <div class="hkia-progress-row">
      <div class="hkia-progress-track"><div class="hkia-progress-fill" id="progressFill"></div></div>
      <div class="hkia-progress-label" id="progressLabel">0%</div>
    </div>
  </div>
  <div class="hkia-tabs">
    <button class="hkia-tab active" data-tab="regional">Flores Regionais</button>
    <button class="hkia-tab" data-tab="event">Flores de Evento</button>
  </div>
  <div class="hkia-body">
    <div class="hkia-filters">
      <button class="hkia-filter-btn active" data-filter="all">Todas Espécies</button>
      <button class="hkia-reset" id="resetBtn">Zerar Progresso</button>
    </div>
    <div id="content"></div>
  </div>
  
  <div class="hkia-modal-overlay" id="flowerModalOverlay">
    <div class="hkia-modal">
      <div class="hkia-modal-header">
        <h2 id="modalTitle">Nome da Flor</h2>
        <button class="hkia-modal-close" id="closeModalBtn">&times;</button>
      </div>
      <div class="hkia-modal-body" id="modalBody"></div>
    </div>
  </div>
</div>

<script>
(function(){
  var COLOR_INFO = {
    white:{name:'Branco',hex:'#F3F0F4'}, red:{name:'Vermelho',hex:'#C24B4C'}, coral:{name:'Coral',hex:'#E37571'}, orange:{name:'Laranja',hex:'#F5B354'},
    yellow:{name:'Amarelo',hex:'#F5E97D'}, lime:{name:'Verde-limão',hex:'#DBFA7C'}, green:{name:'Verde',hex:'#81B855'}, teal:{name:'Verde-azulado',hex:'#88EBE2'},
    sky:{name:'Céu',hex:'#8EB8F9'}, blue:{name:'Azul',hex:'#5C83F6'}, violet:{name:'Violeta',hex:'#7660C1'}, magenta:{name:'Magenta',hex:'#DD66F7'},
    hotpink:{name:'Rosa-choque',hex:'#E371AD'}, warmpink:{name:'Rosa-quente',hex:'#E897A4'}, blush:{name:'Rosa-claro',hex:'#F0BFC3'}, peach:{name:'Pêssego',hex:'#F6D4AE'},
    cream:{name:'Creme',hex:'#FAF0C5'}, mint:{name:'Menta',hex:'#BAF8AD'}, cloud:{name:'Nuvem',hex:'#C2EEFB'}, ice:{name:'Gelo',hex:'#9FC2F7'},
    periwinkle:{name:'Azul-lavanda',hex:'#D4D6FA'}, lilac:{name:'Lilás',hex:'#D0B4F9'}, pink:{name:'Rosa',hex:'#EBA2C9'}
  };
  var COLORS = Object.keys(COLOR_INFO);

  var PATTERNS = {
    'none': 'Normal (Sem padrão)', 'ombre': 'Ombre', 'trim': 'Trim (Borda)', 'speckled': 'Speckled (Pontos)',
    'striped': 'Striped (Listras)', 'patch': 'Patch (Xadrez)', 'ring': 'Ring (Anel)', 'confetti': 'Confetti'
  };

  var FLOWERS = [
    {id:'r1',name:'Bellbutton',cat:'regional',group:'Merry Meadow', compat:['none','ombre','trim','speckled','striped','patch','ring','confetti']},
    {id:'r2',name:'Dandelily',cat:'regional',group:'Merry Meadow', compat:['none','ombre','trim','speckled','striped','patch','ring','confetti']},
    {id:'r3',name:'Penstemum',cat:'regional',group:'Merry Meadow', compat:['none','ombre','trim','speckled','striped','patch','ring','confetti']},
    {id:'r4',name:'Tulias',cat:'regional',group:'Merry Meadow', compat:['none','ombre','trim','speckled','striped','patch','ring','confetti']},
    {id:'r5',name:'Hibiscus',cat:'regional',group:'Seaside Resort', compat:['none','ombre','trim','speckled','striped','patch','ring','confetti']},
    {id:'r6',name:'Ghostgleam',cat:'regional',group:'Spooky Swamp', compat:['none','ombre','trim','speckled','striped','patch','ring','confetti']},
    {id:'r7',name:'Thistle',cat:'regional',group:'Gemstone Mountain', compat:['none','ombre','trim','speckled','striped','patch','ring','confetti']},
    {id:'r8',name:'Heavy Nettle',cat:'regional',group:'Mount Hothead', compat:['none','ombre','trim','speckled','patch','ring','confetti']},
    {id:'r9',name:'Anemone',cat:'regional',group:'Rainbow Reef', compat:['none','ombre','trim','patch','ring','confetti']},
    {id:'r10',name:'Dreampuff',cat:'regional',group:'Cloud Island', compat:['none','ombre','trim']},
    {id:'r11',name:'Frostfeather',cat:'regional',group:'Icy Peak', compat:['none','ombre','trim','speckled']},
    {id:'r12',name:'Blazebulb',cat:'regional',group:'Caldera', compat:['none','ombre','trim','speckled','patch','ring']},
    {id:'r13',name:'Crystalia',cat:'regional',group:'Crystal Caves', compat:['none','ombre','trim','patch','ring']},
    {id:'r14',name:'Bubbaluna',cat:'regional',group:'The Moon', compat:['none','ombre','trim','speckled','striped','patch','ring','confetti']},
    
    {id:'e1',name:'Marigold',cat:'event',group:'Colorblaze Carnival', compat:['none','ombre','trim','speckled','striped','patch','ring','confetti']},
    {id:'e2',name:'Eggwort',cat:'event',group:'Month of Meh', compat:['none','ombre','trim','speckled','striped','patch','ring','confetti']},
    {id:'e3',name:'Pinwheel',cat:'event',group:'Paper Parade', compat:['none','ombre','trim','speckled','striped','patch','ring','confetti']},
    {id:'e4',name:'Petunia',cat:'event',group:'Jam Jamboree', compat:['none','ombre','trim','speckled','striped','patch','ring','confetti']},
    {id:'e5',name:'Rose',cat:'event',group:'Hugs & Hearts', compat:['none','ombre','trim','speckled','striped','patch','ring','confetti']}
  ];

  var STORAGE_KEY = 'hkia-combos-v1';
  var state = {}; // Formato: state[flowerId][color_pattern] = true/false
  var activeTab = 'regional';
  var selectedColor = 'pink';
  var currentFlower = null;

  function getWikiImg(name) {
    var urlName = encodeURIComponent(name.replace(/ /g, '_'));
    return '<img src="https://hellokittyislandadventure.wiki.gg/wiki/Special:FilePath/' + urlName + '.png" onerror="this.src=\'https://hellokittyislandadventure.wiki.gg/wiki/Special:FilePath/Flower.png\';" />';
  }

  function render() {
    var content = document.getElementById('content');
    content.innerHTML = '';

    var filtered = FLOWERS.filter(f => f.cat === activeTab);
    var groups = [...new Set(filtered.map(f => f.group))];

    groups.forEach(group => {
      var wrap = document.createElement('div');
      wrap.className = 'hkia-group';
      wrap.innerHTML = `<div class="hkia-group-header"><span class="hkia-group-title">${group}</span></div>`;
      
      var grid = document.createElement('div');
      grid.className = 'hkia-grid';

      filtered.filter(f => f.group === group).forEach(f => {
        var flowerCombos = state[f.id] || {};
        var gotCount = Object.keys(flowerCombos).filter(k => flowerCombos[k]).length;
        var totalPossible = COLORS.length * f.compat.length;

        var card = document.createElement('div');
        card.className = 'hkia-card';
        card.innerHTML = `
          <div class="hkia-flower-img">${getWikiImg(f.name)}</div>
          <div class="hkia-card-name">${f.name}</div>
          <div class="hkia-card-meta">Obtidos: <b>${gotCount} / ${totalPossible}</b></div>
        `;
        card.onclick = function() { openModal(f); };
        grid.appendChild(card);
      });

      wrap.appendChild(grid);
      content.appendChild(wrap);
    });
    updateProgress();
  }

  function openModal(flower) {
    currentFlower = flower;
    selectedColor = COLORS[0];
    document.getElementById('modalTitle').innerHTML = getWikiImg(flower.name) + ' ' + flower.name;
    renderModalBody();
    document.getElementById('flowerModalOverlay').classList.add('open');
  }

  function renderModalBody() {
    var body = document.getElementById('modalBody');
    var fState = state[currentFlower.id] || {};

    var colorHtml = COLORS.map(cKey => {
      var active = cKey === selectedColor ? 'active' : '';
      return `<div class="color-pill ${active}" onclick="selectColor('${cKey}')">
        <span class="color-pill-dot" style="background:${COLOR_INFO[cKey].hex}"></span>
        ${COLOR_INFO[cKey].name}
      </div>`;
    }).join('');

    var comboHtml = currentFlower.compat.map(pKey => {
      var comboKey = selectedColor + '_' + pKey;
      var isGot = !!fState[comboKey];
      return `<div class="combo-item ${isGot ? 'got' : ''}" onclick="toggleCombo('${comboKey}')">
        <div class="combo-checkbox">${isGot ? '✓' : ''}</div>
        <span>${currentFlower.name} ${COLOR_INFO[selectedColor].name} (${PATTERNS[pKey]})</span>
      </div>`;
    }).join('');

    body.innerHTML = `
      <div style="font-weight:700; margin-bottom:8px;">1. Escolha a Cor:</div>
      <div class="color-picker-grid">${colorHtml}</div>
      <div class="combo-box">
        <div class="combo-title">Combinações Exatas para ${currentFlower.name} ${COLOR_INFO[selectedColor].name}:</div>
        <div class="combo-options">${comboHtml}</div>
      </div>
    `;
  }

  window.selectColor = function(colorKey) {
    selectedColor = colorKey;
    renderModalBody();
  };

  window.toggleCombo = function(comboKey) {
    if (!state[currentFlower.id]) state[currentFlower.id] = {};
    state[currentFlower.id][comboKey] = !state[currentFlower.id][comboKey];
    save();
    renderModalBody();
  };

  function updateProgress() {
    var total = 0, got = 0;
    FLOWERS.forEach(f => {
      total += COLORS.length * f.compat.length;
      if (state[f.id]) {
        got += Object.keys(state[f.id]).filter(k => state[f.id][k]).length;
      }
    });
    var pct = total ? Math.round((got / total) * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressLabel').textContent = got + ' / ' + total + ' (' + pct + '%)';
  }

  function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }
  function load() {
    try { state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch(e) { state = {}; }
    render();
  }

  document.getElementById('closeModalBtn').onclick = function() {
    document.getElementById('flowerModalOverlay').classList.remove('open');
    render();
  };

  document.querySelectorAll('.hkia-tab').forEach(btn => {
    btn.onclick = function() {
      document.querySelectorAll('.hkia-tab').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      activeTab = btn.getAttribute('data-tab');
      render();
    };
  });

  document.getElementById('resetBtn').onclick = function() {
    if (confirm('Deseja zerar todo o progresso de combinações?')) {
      state = {}; save(); render();
    }
  };

  load();
})();
</script>
</body>
</html>
